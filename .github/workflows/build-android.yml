name: build

on:
  workflow_dispatch: {}     # 手动触发
  push:
    tags:
      - 'v*'                # 推送 tag 时触发

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing (safe mode)
        if: startsWith(matrix.platform, 'android')
        run: |
          mkdir -p android/app

          # === keystore ===
          if [ -n "${{ secrets.KEYSTORE || '' }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            echo "[info] keystore decoded from secrets"
          else
            echo "[warn] no keystore found — creating temp one"
            keytool -genkeypair \
              -alias flclash \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android/app/keystore.jks \
              -storepass android -keypass android \
              -dname "CN=FlClash,O=FlClash,C=CN"
          fi

          # === google-services.json ===
          if [ -n "${{ secrets.SERVICE_JSON || '' }}" ]; then
            echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
            echo "[info] google-services.json restored"
          else
            echo "{}" > android/app/google-services.json
            echo "[warn] empty google-services.json created"
          fi

          # === local.properties ===
          echo "keyAlias=${{ secrets.KEY_ALIAS || 'flclash' }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD || 'android' }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || 'android' }}" >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build FlClash Android
        run: dart setup.dart android --env stable

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-android
          path: ./dist
          overwrite: true
