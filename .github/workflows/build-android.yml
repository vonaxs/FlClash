name: build

on:
  workflow_dispatch:           # ✅ 支持手动触发
  push:
    tags:
      - 'v*'                   # ✅ 推送 tag 时也能自动触发

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ubuntu-latest     # ✅ 固定为 ubuntu（只构建安卓）
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Build FlClash Android
        run: |
          dart setup.dart android --env stable || \
          flutter build apk --release --split-per-abi --no-shrink
          echo "✅ Android 构建完成"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: |
            ./dist/
            build/app/outputs/flutter-apk/*.apk
          overwrite: true
